<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DepthWizard — Coordinate to 3D Terrain</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
    h1 { margin-bottom: 5px; color: #38bdf8; }
    p.subtitle { color: #94a3b8; margin-top: 0; }
    .card { background: #1e293b; max-width: 850px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    #map { height: 350px; border-radius: 8px; margin: 15px 0; }
    .input-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap; }
    input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px 12px; border-radius: 6px; width: 140px; }
    button { background: #2563eb; color: white; border: none; padding: 10px 20px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .btn-preset { background: #334155; font-size: 13px; padding: 6px 12px; }
    .btn-preset:hover { background: #475569; }
    #status { margin-top: 15px; font-weight: 500; min-height: 24px; color: #38bdf8; }
    .upload-fallback { margin-top: 20px; border-top: 1px solid #334155; padding-top: 15px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DepthWizard (SIH26175)</h1>
    <p class="subtitle">Single-View Satellite Elevation & 3D Reconstruction</p>

    <div style="margin-bottom: 10px;">
      <span style="font-size: 14px; color: #cbd5e1;">Disaster Presets: </span>
      <button class="btn-preset" onclick="setPreset(11.5277, 76.1950, 'Wayanad Landslide')">Wayanad Landslide</button>
      <button class="btn-preset" onclick="setPreset(30.5568, 79.5660, 'Joshimath Subsidence')">Joshimath</button>
      <button class="btn-preset" onclick="setPreset(10.0889, 77.0595, 'Munnar Ghats')">Munnar</button>
      <button class="btn-preset" onclick="setPreset(8.5241, 76.9366, 'Trivandrum (Test)')">Trivandrum</button>
    </div>

    <div id="map"></div>

    <div class="input-row">
      <div><label>Lat: </label><input type="number" step="0.0001" id="lat" value="8.5241"></div>
      <div><label>Lon: </label><input type="number" step="0.0001" id="lon" value="76.9366"></div>
      <div><label>Box (km): </label><input type="number" step="0.5" id="boxSize" value="3.0"></div>
    </div>

    <button onclick="fetchCoords()">Fetch Sentinel-2 & Generate 3D Terrain</button>
    <div id="status"></div>

    <div class="upload-fallback">
      Or upload a local image/GeoTIFF:
      <input type="file" id="fileInput" accept="image/*" style="width: auto;">
      <button class="btn-preset" onclick="uploadFile()">Upload Image</button>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([8.5241, 76.9366], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

    let marker = L.marker([8.5241, 76.9366], { draggable: true }).addTo(map);

    function updateInputs(lat, lon) {
      document.getElementById('lat').value = lat.toFixed(4);
      document.getElementById('lon').value = lon.toFixed(4);
    }

    map.on('click', (e) => {
      marker.setLatLng(e.latlng);
      updateInputs(e.latlng.lat, e.latlng.lng);
    });

    marker.on('dragend', (e) => {
      const pos = e.target.getLatLng();
      updateInputs(pos.lat, pos.lng);
    });

    function setPreset(lat, lon, label) {
      map.setView([lat, lon], 12);
      marker.setLatLng([lat, lon]);
      updateInputs(lat, lon);
      document.getElementById('status').innerText = `Selected preset: ${label}`;
    }

    async function fetchCoords() {
      const lat = parseFloat(document.getElementById('lat').value);
      const lon = parseFloat(document.getElementById('lon').value);
      const box_size_km = parseFloat(document.getElementById('boxSize').value);

      const status = document.getElementById('status');
      status.innerText = "Querying Copernicus CDSE & fetching Sentinel-2 bands...";

      try {
        const res = await fetch('/fetch-coords', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lon, box_size_km })
        });
        const data = await res.json();
        if (data.status === 'done') {
          status.innerText = "3D Terrain generated! Redirecting to 3D viewer...";
          setTimeout(() => { window.location.href = '/index.html?t=' + Date.now(); }, 500);
        }
      } catch (e) {
        status.innerText = "Error: " + e.message;
      }
    }

    async function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert('Select a file');
      document.getElementById('status').innerText = "Processing image...";
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch('/upload', { method: 'POST', body: fd });
      const data = await res.json();
      if (data.status === 'done') {
        window.location.href = '/index.html?t=' + Date.now();
      }
    }
  </script>
</body>
</html>
