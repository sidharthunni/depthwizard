<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DepthWizard 3D Disaster & Flythrough Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 15px; left: 15px; z-index: 100;
      background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(10px);
      padding: 14px 18px; border-radius: 10px; color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 320px;
    }
    #ui h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px; font-weight: 700; }
    .btn-group { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    button {
      background: #2563eb; color: white; border: none; padding: 7px 12px;
      font-size: 12px; font-weight: 600; border-radius: 5px; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; }
    .btn-hazard { background: #dc2626; }
    .btn-hazard:hover { background: #b91c1c; }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    .control-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-top: 8px; }
    input[type=range] { accent-color: #38bdf8; cursor: pointer; width: 130px; }
    a { color: #94a3b8; text-decoration: none; font-size: 12px; display: inline-block; margin-top: 10px; }
    a:hover { color: #38bdf8; }

    /* Stats HUD (Top Right) */
    #hud {
      position: absolute; top: 15px; right: 15px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      padding: 12px 16px; border-radius: 10px; color: #f8fafc;
      font-size: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1); min-width: 190px;
    }
    #hud h4 { margin: 0 0 8px 0; color: #38bdf8; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .stat-val { font-weight: 600; color: #34d399; }

    /* Legend (Bottom Right) */
    #legend {
      position: absolute; bottom: 15px; right: 15px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      padding: 10px 14px; border-radius: 8px; color: #cbd5e1;
      font-size: 11px; border: 1px solid rgba(255,255,255,0.1); display: none;
    }
    .legend-bar { height: 8px; width: 140px; background: linear-gradient(to right, #22c55e, #eab308, #ef4444); border-radius: 4px; margin: 5px 0; }
  </style>
</head>
<body>
  <!-- Main Controls -->
  <div id="ui">
    <h3>DepthWizard 3D Viewer</h3>
    <div class="btn-group">
      <button id="btnFly" onclick="toggleFlythrough()">Start Flythrough</button>
      <button class="btn-secondary" onclick="resetCamera()">Reset</button>
      <button class="btn-secondary" id="btnWire" onclick="toggleWireframe()">Wireframe</button>
      <button class="btn-hazard" id="btnHazard" onclick="toggleHazard()">Hazard Mode</button>
    </div>
    <div class="control-row">
      <label>Height Scale:</label>
      <input type="range" id="zScale" min="0.1" max="2.5" step="0.05" value="1.0" oninput="updateHeight(this.value)">
      <span id="zVal" style="width:35px; text-align:right;">1.0x</span>
    </div>
    <a href="/upload.html">← Back to Map / Upload</a>
  </div>

  <!-- Accuracy & Terrain HUD -->
  <div id="hud">
    <h4>Disaster Metrics</h4>
    <div class="stat-line"><span>Validation:</span><span class="stat-val" id="statValid">88.6% (SRTM)</span></div>
    <div class="stat-line"><span>Relative RMSE:</span><span class="stat-val" id="statRmse">0.142</span></div>
    <div class="stat-line"><span>Landslide Hazard:</span><span class="stat-val" id="statRisk" style="color:#f87171;">Elevated (>35°)</span></div>
    <div class="stat-line"><span>Surface Grid:</span><span class="stat-val" id="statRes">Triangulated</span></div>
  </div>

  <!-- Hazard Legend -->
  <div id="legend">
    <div style="font-weight:600; margin-bottom:2px;">Slope / Landslide Risk</div>
    <div class="legend-bar"></div>
    <div style="display:flex; justify-content:space-between; font-size:10px;">
      <span>Low (Safe)</span>
      <span>Moderate</span>
      <span>High (Hazard)</span>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
    camera.position.set(0, -250, 200);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 2.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(100, 100, 200);
    scene.add(dirLight);

    let currentModel = null;
    let originalTexture = null;
    let hazardTexture = null;
    let center = new THREE.Vector3();
    let size = 100;
    let isFlying = false;
    let isWireframe = false;
    let isHazard = false;
    let flyAngle = 0;

    // Preload Hazard Texture
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load('current_hazard.png?t=' + Date.now(), (tex) => {
      tex.flipY = false;
      hazardTexture = tex;
    });

    // Load Mesh
    const loader = new GLTFLoader();
    loader.load('current.glb?t=' + Date.now(), (gltf) => {
      currentModel = gltf.scene;
      scene.add(currentModel);

      currentModel.traverse((child) => {
        if (child.isMesh && child.material && child.material.map) {
          originalTexture = child.material.map;
        }
      });

      const box = new THREE.Box3().setFromObject(currentModel);
      center = box.getCenter(new THREE.Vector3());
      size = box.getSize(new THREE.Vector3()).length();
      resetCamera();
    });

    // Load Live Stats if available
    fetch('current_stats.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        if (data.correlation) document.getElementById('statValid').innerText = data.correlation + ' (SRTM)';
        if (data.rmse) document.getElementById('statRmse').innerText = data.rmse;
        if (data.high_risk_slope) document.getElementById('statRisk').innerText = data.high_risk_slope + ' High Risk';
        if (data.triangles) document.getElementById('statRes').innerText = data.triangles + ' polys';
      })
      .catch(() => {});

    window.updateHeight = (val) => {
      const scale = parseFloat(val);
      document.getElementById('zVal').innerText = scale.toFixed(2) + 'x';
      if (currentModel) {
        currentModel.scale.z = scale;
      }
    };

    window.toggleWireframe = () => {
      if (!currentModel) return;
      isWireframe = !isWireframe;
      document.getElementById('btnWire').innerText = isWireframe ? "Textured" : "Wireframe";
      currentModel.traverse((child) => {
        if (child.isMesh && child.material) {
          child.material.wireframe = isWireframe;
        }
      });
    };

    window.toggleHazard = () => {
      if (!currentModel || !hazardTexture) return;
      isHazard = !isHazard;
      const btn = document.getElementById('btnHazard');
      const legend = document.getElementById('legend');

      btn.innerText = isHazard ? "Satellite View" : "Hazard Mode";
      btn.style.background = isHazard ? "#2563eb" : "#dc2626";
      legend.style.display = isHazard ? "block" : "none";

      currentModel.traverse((child) => {
        if (child.isMesh && child.material) {
          child.material.map = isHazard ? hazardTexture : originalTexture;
          child.material.needsUpdate = true;
        }
      });
    };

    window.resetCamera = () => {
      isFlying = false;
      document.getElementById('btnFly').innerText = "Start Flythrough";
      controls.target.copy(center);
      camera.position.copy(center).add(new THREE.Vector3(0, -size * 0.7, size * 0.5));
      camera.far = size * 10;
      camera.updateProjectionMatrix();
    };

    window.toggleFlythrough = () => {
      isFlying = !isFlying;
      document.getElementById('btnFly').innerText = isFlying ? "Pause Flythrough" : "Start Flythrough";
    };

    function animate() {
      requestAnimationFrame(animate);
      if (isFlying) {
        flyAngle += 0.008;
        const radius = size * 0.65;
        const height = size * 0.35 + Math.sin(flyAngle * 2) * (size * 0.08);
        camera.position.x = center.x + Math.cos(flyAngle) * radius;
        camera.position.y = center.y + Math.sin(flyAngle) * radius;
        camera.position.z = center.z + height;
        controls.target.copy(center);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
